services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlasai}
      POSTGRES_USER: ${POSTGRES_USER:-atlasai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlasai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
volumes:
  postgres_data:
