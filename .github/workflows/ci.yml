name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: atlasai
          POSTGRES_USER: atlasai
          POSTGRES_PASSWORD: atlasai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlasai -d atlasai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run: {working-directory: apps/api}
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: atlasai
      POSTGRES_USER: atlasai
      POSTGRES_PASSWORD: atlasai
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Apply database migrations
        working-directory: .
        run: |
          for migration in infra/migrations/*.sql; do
            PGPASSWORD=atlasai psql -h localhost -U atlasai -d atlasai -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: PYTHONPATH=. pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build -t atlasai-api:ci apps/api
      - name: Build web image
        run: docker build -t atlasai-web:ci apps/web

  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm run build
